# Keeps the free Render backend awake (it sleeps after 15 idle minutes, and the first
# request after that takes ~50 s). Pings the health check every 5 minutes, all day:
# one always-on service uses ~720 of Render's 750 free hours a month, so it must be the
# only running free service on the account (JourneyEasy is suspended).
# To save hours instead, ping only 08:00–01:00 Bangladesh time: '*/5 2-18 * * *'.
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 -o /dev/null https://healthnexus-bd-api.onrender.com/api/health
